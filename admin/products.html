<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات | مخبوزات الشام</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/admin/layout.css"><link rel="stylesheet" href="../css/admin/products.css"><link rel="stylesheet" href="../css/admin/section-system.css">
</head><body class="admin-body"><div id="adminSidebar"></div><main class="admin-main"><header class="admin-page-head"><div><span class="eyebrow">إدارة الكتالوج والمخزون</span><h1>المنتجات</h1><p>أضف المنتجات وحدد سعر البيع والكمية المتوفرة.</p></div></header><nav class="supplier-tabs product-tabs" aria-label="إدارة المنتجات"><button type="button" class="supplier-tab" data-product-tab="list">المنتجات الحالية</button><button type="button" class="supplier-tab active" data-product-tab="add">إضافة منتج</button></nav><section class="admin-card" data-product-panel="add"><h2 id="productFormTitle">إضافة منتج جديد</h2><form id="productForm" class="formgrid"><label>اسم المنتج<input required name="name"></label><label>التصنيف<select name="category" id="categorySelect" required><option value="مناقيش وفطائر">مناقيش وفطائر</option><option value="كرواسون">كرواسون</option><option value="بيتزا">بيتزا</option><option value="حلويات">حلويات</option><option value="أخرى">أخرى</option><option value="__custom__">تصنيف جديد...</option></select></label><label id="customCategoryField" class="hidden">اسم التصنيف الجديد<input name="customCategory" id="customCategory"></label><label>سعر القطعة بالليرة السورية<input required name="price" type="number" min="0" step="1"></label><label>الكمية المتوفرة في المخزون<input required name="stock" type="number" min="0" step="1" value="0"><small>تُخصم الكمية تلقائياً عند إصدار فاتورة بيع مباشر.</small></label><label>صورة من الجهاز<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label><label class="wide">الوصف<textarea name="description" rows="2"></textarea></label><div class="wide form-actions"><button class="primary" id="productSubmit">إضافة المنتج</button><button class="outline hidden" id="cancelProductEdit" type="button">إلغاء التعديل</button></div></form></section><section class="admin-card is-hidden" data-product-panel="list"><div class="admin-section-head"><h2>المنتجات الحالية والمخزون</h2><button class="danger" id="deleteAllProducts" type="button">حذف جميع المنتجات</button></div><div class="supplier-filters product-filters"><input id="productSearch" type="search" placeholder="ابحث باسم المنتج أو التصنيف"><select id="productCategoryFilter"><option value="all">كل التصنيفات</option></select><select id="productStockFilter"><option value="all">كل حالات المخزون</option><option value="available">متوفر</option><option value="low">مخزون منخفض</option><option value="out">نافد</option></select><button type="button" class="outline" id="resetProductFilters">إعادة ضبط الفلاتر</button></div><div id="adminProducts" class="admin-products-list"></div></section></main><script src="../js/core.js"></script><script src="../js/admin/navigation.js"></script><script src="../js/admin/products.js"></script></body></html>
