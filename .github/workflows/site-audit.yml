name: Website visual audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Serve the checked-out files locally so the audit can inspect admin
      # layouts without calling the production Pages Functions authentication
      # middleware. Authentication is tested separately in admin-auth-audit.
      - name: Start local preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bakery-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Audit storefront and admin layouts at desktop and mobile sizes
        env:
          SITE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p audit-results
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const routes = [
              '/',
              '/admin/',
              '/admin/products.html',
              '/admin/orders.html',
              '/admin/sales.html',
              '/admin/inventory.html',
              '/admin/material-movements.html',
              '/admin/suppliers.html',
              '/admin/settings.html'
            ];
            const results = [];

            for (const route of routes) {
              for (const viewport of [
                { name: 'desktop', width: 1440, height: 1000 },
                { name: 'mobile', width: 390, height: 844 }
              ]) {
                const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
                const errors = [];
                page.on('pageerror', error => errors.push(error.message));
                page.on('console', message => {
                  if (message.type() === 'error') errors.push(message.text());
                });

                const url = new URL(route, process.env.SITE_URL).toString();
                let status = null;
                let title = '';
                let screenshot = null;

                try {
                  const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  status = response ? response.status() : null;
                  await page.waitForTimeout(1200);
                  title = await page.title();
                  screenshot = `audit-results/${route === '/' ? 'storefront' : route.replaceAll('/', '-').replaceAll('.html', '')}-${viewport.name}.png`;
                  await page.screenshot({ path: screenshot, fullPage: true, animations: 'disabled' });
                } catch (error) {
                  errors.push(`Navigation: ${error.message}`);
                }

                results.push({ route, viewport: viewport.name, url, status, title, errors, screenshot });
                await page.close();
              }
            }

            fs.writeFileSync('audit-results/report.json', JSON.stringify({
              auditedAt: new Date().toISOString(),
              site: process.env.SITE_URL,
              mode: 'local-static-preview; production authentication tested separately',
              results
            }, null, 2));
            await browser.close();

            const failed = results.filter(item => item.status === null || item.status >= 400 || item.errors.length > 0);
            console.log(JSON.stringify(results, null, 2));
            if (failed.length) process.exitCode = 1;
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakery-store-visual-audit
          path: audit-results/
          if-no-files-found: warn
          retention-days: 7
