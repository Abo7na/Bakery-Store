<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171512">
<title>دخول الإدارة | مخبوزات الشام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f7f5f1;font-family:Cairo,sans-serif}.login-card{width:min(100%,420px);padding:32px;background:#fff;border:1px solid #e8e1d8;border-radius:22px;box-shadow:0 18px 50px #2b21120d}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.brand-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#8b3f25;color:#fff;font-size:24px;font-weight:800}.brand b{display:block;font-size:19px}.brand small{color:#82786e}.login-card h1{margin:0 0 8px;font-size:25px}.login-card p{margin:0 0 22px;color:#766e66}.login-card label{display:block;margin-bottom:8px;font-weight:700}.login-card input{width:100%;height:50px;padding:0 14px;border:1px solid #d9d2ca;border-radius:12px;font:inherit;direction:ltr;text-align:left}.login-card button{width:100%;height:50px;margin-top:16px;border:0;border-radius:12px;background:#8b3f25;color:#fff;font:700 16px Cairo;cursor:pointer}.login-card button:disabled{opacity:.65;cursor:wait}.message{min-height:25px;margin-top:12px;color:#b42318;font-size:14px}.back{display:block;margin-top:12px;text-align:center;color:#6e6258;text-decoration:none}
</style>
</head>
<body>
<main class="login-card">
<div class="brand"><span class="brand-mark">م</span><span><b>مخبوزات الشام</b><small>منطقة الإدارة الخاصة</small></span></div>
<h1>تسجيل دخول المدير</h1>
<p>هذه الصفحة مخصصة لإدارة المتجر فقط.</p>
<form id="adminLoginForm">
<label for="adminPassword">كلمة مرور الإدارة</label>
<input id="adminPassword" name="password" type="password" autocomplete="current-password" required minlength="1" autofocus>
<button id="loginButton" type="submit">دخول آمن</button>
<div id="loginMessage" class="message" role="status" aria-live="polite"></div>
</form>
<a class="back" href="index.html">العودة إلى المتجر</a>
</main>
<script src="js/admin-login.js"></script>
</body>
</html>
