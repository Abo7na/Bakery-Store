<div class="overlay hidden" id="cartOverlay"><aside class="drawer"><div class="drawer-head"><div><h2>سلة مشترياتك</h2><small class="drawer-subtitle">راجع اختياراتك قبل تأكيد الطلب</small></div><button class="x" id="closeCart" aria-label="إغلاق السلة">×</button></div><button type="button" class="continue-shopping" id="continueShopping"><span>←</span> متابعة التسوق وإضافة منتجات</button><div id="cartItems" class="cart-items">السلة فارغة حالياً.</div><div id="checkout" class="checkout hidden"><div class="checkout-title"><div><h3 id="checkoutTitle">بيانات الاستلام</h3><small id="checkoutSubtitle">أدخل معلومات التوصيل أو الاستلام</small></div><button type="button" class="back-to-cart" id="backToCart">العودة إلى السلة</button></div><div class="checkout-progress"><span id="stepOneMark" class="current">1. بيانات الاستلام</span><span id="stepTwoMark">2. الدفع والتأكيد</span></div><form id="orderForm"><div id="checkoutStepOne"><label>الاسم (اختياري)<input name="customer" autocomplete="name"></label><label>رقم الهاتف<input required name="phone" type="tel"></label><label>طريقة الاستلام<select name="fulfillment" id="fulfillment"><option value="pickup">استلام من المخبز</option><option value="delivery">توصيل</option></select></label><label id="addressLabel">الموقع / العنوان <input required name="address" autocomplete="street-address" placeholder="أدخل موقعك أو عنوانك"></label><label class="deferred-toggle"><input type="checkbox" id="deferredOrder" name="deferred" value="yes"> هذه طلبية مؤجلة وأريد تحديد موعدها</label><label id="requestedTimeField" class="hidden">موعد التسليم المطلوب<input name="time" id="requestedTime" type="datetime-local"></label><button type="button" class="primary full" id="nextCheckoutStep">التالي: الدفع</button></div><div id="checkoutStepTwo" class="hidden"><label>طريقة الدفع<select name="payment" id="paymentMethod"><option value="cash">نقداً / دفع يدوي</option><option value="sham">شام كاش</option></select></label><div id="shamPaymentInfo" class="sham-payment-info hidden"><b>حوّل المبلغ إلى حساب شام كاش الخاص بالمتجر</b><div class="sham-account-row"><span id="shamAccountValue">لم يحدد المتجر حساب شام كاش بعد.</span><button type="button" class="outline" id="copyShamAccount" disabled>نسخ</button></div><small id="copyShamStatus" aria-live="polite"></small></div><label id="transactionField" class="hidden">رقم عملية شام كاش <input name="transaction" id="transactionNumber" inputmode="numeric" autocomplete="off"></label><label>ملاحظات<textarea name="notes"></textarea></label><div class="checkout-summary" id="checkoutSummary"></div><div class="checkout-actions"><button type="button" class="outline" id="backCheckoutStep">رجوع</button><button class="primary full">تأكيد وإرسال الطلب</button></div></div></form></div><div class="drawer-foot" id="drawerFoot"><b id="cartTotal">المجموع: 0 ل.س</b><button id="checkoutBtn" class="primary full">متابعة الطلب</button></div></aside></div>
