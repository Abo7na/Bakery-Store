<div id="productsAdmin" class="tab hidden"><h3>إضافة منتج</h3><form id="productForm" class="formgrid"><label>اسم المنتج<input required name="name" placeholder="مثال: منقوشة زعتر"></label><label>التصنيف<select name="category" id="categorySelect" required><option value="مناقيش وفطائر">مناقيش وفطائر</option><option value="كرواسون">كرواسون</option><option value="بيتزا">بيتزا</option><option value="حلويات">حلويات</option><option value="أخرى">أخرى</option><option value="__custom__">تصنيف جديد...</option></select></label><label id="customCategoryField" class="hidden">اسم التصنيف الجديد<input name="customCategory" id="customCategory" placeholder="اكتب اسم التصنيف"></label><label>السعر<input required name="price" type="number" min="0" step="1"></label><label>صورة المنتج من جهازك<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label><label class="wide">الوصف<textarea name="description" rows="2"></textarea></label><div class="product-form-actions wide"><button class="primary" id="productSubmit" type="submit">إضافة المنتج</button><button class="outline hidden" id="cancelProductEdit" type="button">إلغاء التعديل</button></div></form><div class="admin-products-head"><h3>المنتجات الحالية</h3><button class="danger" id="deleteAllProducts" type="button">حذف جميع المنتجات</button></div><div id="adminProducts" class="admin-list"></div></div>
